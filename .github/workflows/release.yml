name: Release

# 推送 v* 标签时自动构建 Windows 安装包并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'
  # 允许手动触发（用于测试构建，不会创建 Release）
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: album-shelf
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: album-shelf/package-lock.json

      # 本地开发使用的 npm 镜像（npm.nie.netease.com）在 GitHub 云环境不可达，
      # 这里强制使用官方源并重写 lockfile 中的 resolved 地址
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund

      - name: 构建安装包
        run: npm run dist

      - name: 创建 Release 并上传安装包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: album-shelf/dist/*.exe
          generate_release_notes: true
